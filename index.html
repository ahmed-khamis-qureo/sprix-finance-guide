const DATA=await new Response(new Blob([Uint8Array.from(atob(window.SPX_PACKED),c=>c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream("gzip"))).json();
const app=document.getElementById('app'),ar=n=>Number(n).toLocaleString('ar-EG'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let query='';let state={saved:[],last:''};try{state=JSON.parse(localStorage.getItem('sprix-finance')||'null')||state}catch{}function persist(){try{localStorage.setItem('sprix-finance',JSON.stringify(state))}catch{}}function go(path){location.hash=path;scrollTo(0,0)}const foot='<footer class="foot">إعداد وتصميم أحمد بن خميس · مرجع تعليمي مستقل غير تابع لـSPRIX. الإجابات والتوضيحات مطابقة للمصدر المتاح وقت المراجعة. طابق نص السؤال والاختيار، فقد يختلف الترتيب. لا يوجد تسجيل دخول أو حل آلي هنا.</footer>';function topbar(title,sub,back=''){return `<header class="top"><button data-go="${back}">‹ رجوع</button><div class="title"><h2>${esc(title)}</h2><div class="muted">${esc(sub)}</div></div><button data-go="">الرئيسية</button></header>`}function entryPath(item){return itemPath(item)+(item.type==='review'||!item.questions?.length?'':'/q/1')}function itemPath(item){return `/item/${item.type}/${item.id}`}function itemLabel(t){return {chapter:'درس',review:'مراجعة',test:'اختبار'}[t]}const all=DATA.units.flatMap(u=>u.sections.flatMap(s=>s.items.map(i=>({...i,unit:u.n,section:s.title}))));function render(){const parts=location.hash.slice(1).split('/').filter(Boolean);let html='';if(!parts.length){html=`<section class="hero"><div class="eyebrow">مرجع المذاكرة · SPRIX Learning Square</div><h1>حلول الثقافة المالية</h1><p class="muted">اختار الوحدة، بعدها الدرس أو الاختبار. هتلاقي الإجابة تحت كل سؤال.</p><div class="counts"><span>${ar(DATA.units.length)} وحدات</span><span>${ar(DATA.counts.chapters)} درس</span><span>${ar(DATA.counts.tests)} اختبار</span><span>${ar(DATA.counts.questions)} سؤال بإجابته</span></div></section><label class="muted" for="search">ابحث بنص السؤال أو اسم الدرس</label><input id="search" type="search" placeholder="مثال: المقايضة، الزكاة، الاستثمار" value="${esc(query)}"><div class="home-tools"><button id="saved">المحفوظات · ${ar(state.saved.length)}</button>${state.last?`<button data-go="${state.last}">كمّل من آخر سؤال</button>`:''}</div>`;if(query){const q=query.toLowerCase();const found=all.flatMap(i=>(i.questions||[]).map((x,n)=>({i,x,n}))).filter(v=>(v.x.text+' '+v.i.title+' '+v.x.answer).toLowerCase().includes(q));html+=`<p class="muted">${ar(found.length)} نتيجة</p><div class="search-results">${found.map(v=>`<button class="item" data-go="${itemPath(v.i)}/q/${v.n+1}"><span>${esc(v.x.text)}<small>${esc(v.i.title)} · ${itemLabel(v.i.type)}</small></span><span>‹</span></button>`).join('')||'<div class="empty">مفيش نتائج للكلمة دي. جرّب كلمة تانية.</div>'}</div>`}else html+=`<div class="grid">${DATA.units.map(u=>`<button class="unit" data-go="/unit/${u.n}"><span class="num">${ar(u.n)}</span><span><strong>${esc(u.title)}</strong><small>${ar(u.sections.length)} موضوعات · ${ar(u.sections.flatMap(s=>s.items).filter(i=>i.type==='chapter').length)} دروس</small></span></button>`).join('')}</div>`;html+=foot}else if(parts[0]==='unit'){const u=DATA.units.find(x=>x.n==parts[1]);if(!u){go('');return}html=topbar(u.title,`الوحدة ${ar(u.n)}`)+u.sections.map((s,n)=>`<section class="section"><div class="eyebrow">الموضوع ${ar(n+1)}</div><h3>${esc(s.title)}</h3><div class="items">${s.items.map(i=>`<button class="item" data-go="${entryPath(i)}"><span>${esc(i.title)}<small>${itemLabel(i.type)}${i.questions?.length?' · '+ar(i.questions.length)+' أسئلة':''}</small></span><span class="tag">${itemLabel(i.type)} ‹</span></button>`).join('')}</div></section>`).join('')+foot}else if(parts[0]==='item'){const i=all.find(x=>x.type===parts[1]&&x.id==parts[2]);if(!i){go('');return}const back=`/unit/${i.unit}`;if(parts[3]==='q'){const n=+parts[4]-1,x=i.questions[n];if(!x){go(itemPath(i));return}const path=`${itemPath(i)}/q/${n+1}`;state.last=path;persist();html=topbar(`السؤال ${ar(n+1)} من ${ar(i.questions.length)}`,i.title,`/unit/${i.unit}`)+`<div class="progress"><i style="width:${(n+1)/i.questions.length*100}%"></i></div><article class="card"><div class="eyebrow">${itemLabel(i.type)} · ${esc(i.section)}</div><p class="q">${esc(x.text)}</p>${x.image?`<img class="question-img" src="${esc(x.image)}" alt="صورة السؤال">`:''}<ol class="choices">${x.options.map((o,k)=>`<li class="${o.correct?'correct':''}"><span class="choice-letter">${['أ','ب','ج','د','هـ'][k]||ar(k+1)}.</span><span>${esc(o.text)}${o.image?`<img class="question-img" src="${esc(o.image)}" alt="صورة الاختيار">`:''}</span></li>`).join('')}</ol></article><section class="answer"><b>الإجابة الصحيحة من مصدر المنصة</b><p>${esc(x.answer)}</p></section>${x.explanation?`<section class="explain"><h3>ليه دي الإجابة؟</h3><div>${x.explanation}</div></section>`:''}<div class="tools"><button id="save" data-path="${path}">${state.saved.includes(path)?'★ محفوظ':'☆ احفظ للمراجعة'}</button><button id="copy" data-text="${esc(x.answer)}">انسخ الإجابة</button><button id="link">انسخ رابط السؤال</button></div><div class="pager"><button data-go="${itemPath(i)}/q/${n}" ${n===0?'disabled':''}>السابق</button><span>${ar(n+1)} / ${ar(i.questions.length)}</span><button data-go="${itemPath(i)}/q/${n+2}" ${n+1===i.questions.length?'disabled':''}>التالي</button></div>`}else{html=topbar(i.title,`${itemLabel(i.type)} · ${i.section}`,back);if(i.type==='review')html+=`<section class="card">${i.notes.map(x=>`<div class="review"><h3>${esc(x.title)}</h3><p>${x.description}</p></div>`).join('')}</section>`;else html+=`<div class="items">${i.questions.map((x,n)=>`<button class="item" data-go="${itemPath(i)}/q/${n+1}"><span><span class="muted">السؤال ${ar(n+1)}</span><br>${esc(x.text)}</span><span>‹</span></button>`).join('')||'<div class="empty">نشاط تعليمي بدون أسئلة اختيار.</div>'}</div>`}html+=`<a class="source" href="https://egy.app.spx-learning-square.com/subjects/7/curriculum" target="_blank" rel="noopener">المصدر: منهج الثقافة المالية على SPRIX ↗</a>`+foot}else if(parts[0]==='saved'){html=topbar('المحفوظات','محفوظة على جهازك')+`<div class="items">${state.saved.map(p=>{const z=p.split('/'),i=all.find(i=>i.type===z[2]&&i.id==z[3]);return `<button class="item" data-go="${p}">${esc(i?.title||'سؤال محفوظ')} · السؤال ${ar(z[5])}<span>‹</span></button>`}).join('')||'<div class="empty">لسه مفيش أسئلة محفوظة.</div>'}</div>`}app.innerHTML=html}document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.hasAttribute('data-go')){query='';go(b.dataset.go)}if(b.id==='saved')go('/saved');if(b.id==='save'){const p=b.dataset.path;state.saved=state.saved.includes(p)?state.saved.filter(x=>x!==p):[...state.saved,p];persist();render()}if(b.id==='copy'||b.id==='link'){try{await navigator.clipboard.writeText(b.id==='link'?location.href:b.dataset.text);b.textContent='تم النسخ ✓'}catch{b.textContent='حدد النص وانسخه'}}});document.addEventListener('input',e=>{if(e.target.id==='search'){const at=e.target.selectionStart;query=e.target.value;render();const s=document.getElementById('search');s.focus();s.setSelectionRange?.(at,at)}});addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
</script></html>
